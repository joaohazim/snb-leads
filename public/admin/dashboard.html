<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SNB Leads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-building text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900">Painel SNB Leads</h1>
                        <p class="text-sm text-gray-600">Administração de Leads</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <button 
                        id="exportBtn"
                        class="px-3 py-2 text-sm border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        <i class="fas fa-download mr-2"></i>Exportar CSV
                    </button>
                    <button 
                        id="logoutBtn"
                        class="px-3 py-2 text-sm border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        <i class="fas fa-sign-out-alt mr-2"></i>Sair
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Loading -->
        <div id="loading" class="text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="text-gray-600 mt-4">Carregando leads...</p>
        </div>

        <!-- Error -->
        <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md mb-6">
            <div class="flex">
                <i class="fas fa-exclamation-circle mr-3 mt-1"></i>
                <div>
                    <span id="errorText"></span>
                    <button id="retryBtn" class="block mt-2 text-sm underline hover:no-underline">
                        Tentar Novamente
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div id="stats" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-users text-blue-600"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">Total de Leads</p>
                        <p id="totalLeads" class="text-2xl font-bold text-gray-900">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-calendar text-green-600"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">Hoje</p>
                        <p id="todayLeads" class="text-2xl font-bold text-gray-900">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-comment text-purple-600"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">Com Mensagem</p>
                        <p id="withMessage" class="text-2xl font-bold text-gray-900">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Leads Table -->
        <div id="leadsContainer" class="hidden bg-white rounded-lg shadow-sm">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Leads Capturados</h2>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Contato
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Interesse
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Mensagem
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Data
                            </th>
                        </tr>
                    </thead>
                    <tbody id="leadsTable" class="bg-white divide-y divide-gray-200">
                        <!-- Leads will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- No Leads -->
        <div id="noLeads" class="hidden bg-white rounded-lg shadow-sm p-8 text-center">
            <i class="fas fa-users text-gray-400 text-4xl mb-4"></i>
            <p class="text-gray-600">Nenhum lead encontrado</p>
        </div>
    </main>

    <script>
        let allLeads = [];

        // Check authentication on page load
        window.addEventListener('load', function() {
            loadLeads();
        });

        // Logout button
        document.getElementById('logoutBtn').addEventListener('click', function() {
            // Clear any stored auth data
            document.cookie = 'admin_logged=; Max-Age=0; path=/';
            
            // Redirect to login
            window.location.href = '/admin/index.html';
        });

        // Export button
        document.getElementById('exportBtn').addEventListener('click', function() {
            exportToCSV();
        });

        // Retry button
        document.getElementById('retryBtn').addEventListener('click', function() {
            loadLeads();
        });

        async function loadLeads() {
            showLoading();
            
            try {
                const response = await fetch('/api/admin/leads', {
                    credentials: 'include' // Include cookies
                });
                
                const data = await response.json();
                
                if (data.success) {
                    allLeads = data.leads;
                    displayLeads(allLeads);
                    updateStats(allLeads);
                    showContent();
                } else {
                    if (response.status === 401) {
                        // Not authenticated - redirect to login
                        window.location.href = '/admin/index.html';
                    } else {
                        showError(data.message || 'Erro ao carregar leads');
                    }
                }
            } catch (error) {
                console.error('Load leads error:', error);
                showError('Erro ao conectar com o servidor');
            }
        }

        function displayLeads(leads) {
            const tbody = document.getElementById('leadsTable');
            tbody.innerHTML = '';
            
            if (leads.length === 0) {
                document.getElementById('leadsContainer').classList.add('hidden');
                document.getElementById('noLeads').classList.remove('hidden');
                return;
            }
            
            document.getElementById('leadsContainer').classList.remove('hidden');
            document.getElementById('noLeads').classList.add('hidden');
            
            leads.forEach(lead => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                
                row.innerHTML = `
                    <td class="px-6 py-4">
                        <div>
                            <p class="font-medium text-gray-900">${escapeHtml(lead.name)}</p>
                            <p class="text-sm text-gray-600">${escapeHtml(lead.email)}</p>
                            <p class="text-sm text-gray-600">${escapeHtml(lead.phone)}</p>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        ${getInterestBadge(lead.interest)}
                    </td>
                    <td class="px-6 py-4">
                        ${lead.message ? 
                            `<p class="text-sm text-gray-600 max-w-xs truncate" title="${escapeHtml(lead.message)}">${escapeHtml(lead.message)}</p>` : 
                            '<span class="text-gray-400 text-sm">-</span>'
                        }
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600">
                        ${new Date(lead.createdAt).toLocaleString('pt-BR')}
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }

        function updateStats(leads) {
            const today = new Date().toDateString();
            const todayLeads = leads.filter(lead => new Date(lead.createdAt).toDateString() === today);
            const leadsWithMessage = leads.filter(lead => lead.message);
            
            document.getElementById('totalLeads').textContent = leads.length;
            document.getElementById('todayLeads').textContent = todayLeads.length;
            document.getElementById('withMessage').textContent = leadsWithMessage.length;
        }

        function getInterestBadge(interest) {
            const colors = {
                'porto-algarve': 'bg-blue-100 text-blue-800',
                'porto-riviera': 'bg-purple-100 text-purple-800',
                'ambos': 'bg-green-100 text-green-800'
            };
            
            const labels = {
                'porto-algarve': 'Porto Algarve',
                'porto-riviera': 'Porto Riviera',
                'ambos': 'Ambos'
            };
            
            const color = colors[interest] || 'bg-gray-100 text-gray-800';
            const label = labels[interest] || interest;
            
            return `<span class="px-2 py-1 rounded-full text-xs font-medium ${color}">${escapeHtml(label)}</span>`;
        }

        function exportToCSV() {
            if (allLeads.length === 0) return;
            
            const headers = ['Nome', 'Email', 'Telefone', 'Interesse', 'Mensagem', 'Data'];
            const csvData = allLeads.map(lead => [
                lead.name,
                lead.email,
                lead.phone,
                lead.interest,
                lead.message || '',
                new Date(lead.createdAt).toLocaleString('pt-BR')
            ]);

            const csvContent = [headers, ...csvData]
                .map(row => row.map(field => `"${field}"`).join(','))
                .join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `leads_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('stats').classList.add('hidden');
            document.getElementById('leadsContainer').classList.add('hidden');
            document.getElementById('noLeads').classList.add('hidden');
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('errorText').textContent = message;
            document.getElementById('stats').classList.add('hidden');
            document.getElementById('leadsContainer').classList.add('hidden');
            document.getElementById('noLeads').classList.add('hidden');
        }

        function showContent() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('stats').classList.remove('hidden');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
